name: Deploy CDLI Whisper GPUs to Modal

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: speech-gpu
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check required deployment credentials
        shell: bash
        run: |
          test -n "$MODAL_TOKEN_ID" || { echo 'Missing MODAL_TOKEN_ID'; exit 1; }
          test -n "$MODAL_TOKEN_SECRET" || { echo 'Missing MODAL_TOKEN_SECRET'; exit 1; }
      - name: Install deployment tooling
        run: python -m pip install 'modal>=1.0,<2' 'fastapi>=0.115,<1'
      - name: Deploy GPU inference service
        run: modal deploy ml/modal/serve.py
