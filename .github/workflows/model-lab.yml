name: Model lab checks
on:
  push:
  pull_request:
jobs:
  model-lab:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: ml/lab/requirements-test.txt
      - run: pip install -r ml/lab/requirements-test.txt
      - run: python -m pytest ml/lab/tests services/speech-api/tests -q
