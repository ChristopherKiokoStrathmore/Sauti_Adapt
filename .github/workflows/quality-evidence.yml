name: Phase quality evidence

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: services/speech-api/requirements-dev.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install Python testing dependencies
        run: |
          python -m pip install -r services/speech-api/requirements-dev.txt
          python -m pip install -r ml/lab/requirements-test.txt
      - name: Fetch pinned official AI4A11y toolkit
        run: python scripts/bootstrap_toolkit.py
      - name: Install exact JavaScript lockfile dependencies
        run: npm ci
      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps chromium
      - name: Run and record all required quality gates
        run: python scripts/quality_report.py --run --evidence quality-evidence.json --output QUALITY_REPORT.md
        env:
          CI: '1'
          NEXT_TELEMETRY_DISABLED: '1'
      - name: Upload measured quality report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase-quality-evidence
          path: |
            QUALITY_REPORT.md
            quality-evidence.json
          if-no-files-found: warn
          retention-days: 30
