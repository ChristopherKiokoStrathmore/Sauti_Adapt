name: Sauti Adapt quality gates
on:
  push:
  pull_request:
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install -r services/speech-api/requirements-dev.txt
      - run: python -m pytest services/speech-api/tests tests/test_deployment_smoke.py -q
  javascript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: python scripts/bootstrap_toolkit.py
      - run: npm install
      - run: npm run test:shared
      - run: npm run test:extension
      - run: npm run typecheck:web
      - run: npm run typecheck:extension
      - run: npm run build:extension
      - run: npm run build:web
        env:
          NEXT_TELEMETRY_DISABLED: '1'
  headway:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: npm ci
      - run: npm run check:headway
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: python scripts/bootstrap_toolkit.py
      - run: pip install -r services/speech-api/requirements-dev.txt
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - run: npm run build:extension
      - run: npm run build:headway
      - run: xvfb-run -a npm run test:e2e
        env:
          CI: '1'
          NEXT_TELEMETRY_DISABLED: '1'
