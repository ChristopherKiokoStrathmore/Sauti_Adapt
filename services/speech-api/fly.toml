# Private speech API. No secret values belong in this file.
# Set SAUTI_API_TOKEN, SAUTI_STORAGE_KEY, SAUTI_TOKEN_PEPPER, SAUTI_ACCOUNTS,
# and SAUTI_ALLOWED_ORIGINS with `fly secrets set`.
app = "sauti-adapt-speech"
primary_region = "jnb"

[build]
  dockerfile = "Dockerfile"

[env]
  SPEECH_MODE = "mock"
  ALLOW_ENROLLMENT = "false"
  SAUTI_PRIVATE_DIR = "/data"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  # One machine keeps the in-process retention timer and rate-limit table alive.
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    grace_period = "10s"
    interval = "15s"
    method = "GET"
    timeout = "5s"
    path = "/health"

[mounts]
  source = "sauti_data"
  destination = "/data"
